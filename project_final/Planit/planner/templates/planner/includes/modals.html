<div class="modal fade planit-modal" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form id="taskForm">
                <div class="modal-header">
                    <div>
                        <span class="tiny-label">NEW TASK</span>
                        <h2 id="taskModalTitle" class="modal-title">Add task</h2>
                    </div>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div id="taskFormError" class="form-error" hidden></div>

                    <label class="task-field task-title-field">
                        <span>Task title</span>
                        <input id="taskTitle" name="title" type="text" maxlength="200" autocomplete="off" required>
                    </label>

                    <details id="taskMoreOptions" class="task-more">
                        <summary>More options</summary>

                        <div class="task-form-grid">
                            <label class="task-field">
                                <span>Area</span>
                                <select id="taskArea" name="area">
                                    <option value="academic">Academic</option>
                                    <option value="personal">Personal</option>
                                </select>
                            </label>

                            <label class="task-field">
                                <span>Type</span>
                                <select id="taskKind" name="kind">
                                    <option value="general">General</option>
                                    <option value="assignment">Assignment</option>
                                    <option value="study">Study</option>
                                    <option value="exam">Exam</option>
                                </select>
                            </label>

                            <label class="task-field">
                                <span>Priority</span>
                                <select id="taskPriority" name="priority">
                                    <option value="normal">Normal</option>
                                    <option value="urgent">Urgent</option>
                                    <option value="later">Later</option>
                                </select>
                            </label>

                            <label class="task-field">
                                <span>Due date</span>
                                <input id="taskDueDate" name="due_date" type="date">
                            </label>

                            <label class="task-field">
                                <span>Subject</span>
                                <select id="taskSubject" name="subject_id">
                                    <option value="">No subject</option>
                                </select>
                            </label>

                            <label class="task-field">
                                <span>Project</span>
                                <select id="taskProject" name="project_id">
                                    <option value="">No project</option>
                                </select>
                            </label>
                        </div>

                        <fieldset id="reviewField" class="task-field review-field" hidden>
                            <legend>Add review tasks before this exam?</legend>
                            <label><input type="checkbox" class="review-offset" value="7"> 7 days before</label>
                            <label><input type="checkbox" class="review-offset" value="3"> 3 days before</label>
                            <label><input type="checkbox" class="review-offset" value="1"> 1 day before</label>
                            <small>Dates that have already passed are skipped.</small>
                        </fieldset>

                        <label class="task-field">
                            <span>Description</span>
                            <textarea id="taskDescription" name="description" rows="3" maxlength="2000"></textarea>
                        </label>
                    </details>
                </div>

                <div class="modal-footer">
                    <button class="soft-button" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button id="taskSubmitButton" class="primary-button" type="submit">Add task</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade planit-modal" id="subjectModal" tabindex="-1" aria-labelledby="subjectModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="subjectForm">
                <div class="modal-header">
                    <div>
                        <span class="tiny-label">COURSE</span>
                        <h2 id="subjectModalTitle" class="modal-title">Add course</h2>
                    </div>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div id="subjectFormError" class="form-error" hidden></div>

                    <label class="task-field">
                        <span>Course name</span>
                        <input id="subjectName" type="text" maxlength="120" required>
                    </label>

                    <div class="task-form-grid">
                        <label class="task-field">
                            <span>Course code</span>
                            <input id="subjectCode" type="text" maxlength="20">
                        </label>

                        <label class="task-field">
                            <span>Semester</span>
                            <input id="subjectSemester" type="text" maxlength="50">
                        </label>
                    </div>

                    <label id="subjectTemplateField" class="task-check">
                        <input id="subjectTemplate" type="checkbox">
                        <span>Add standard assessments (Quiz 10, Midterm 30, Assignment 20, Final 40). You can edit them later.</span>
                    </label>

                    <label class="task-field">
                        <span>Folder color</span>
                        <select id="subjectColor">
                            <option value="lavender">Lavender</option>
                            <option value="butter">Butter</option>
                            <option value="sage">Sage</option>
                            <option value="clay">Clay</option>
                        </select>
                    </label>
                </div>

                <div class="modal-footer">
                    <button class="soft-button" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button id="subjectSubmitButton" class="primary-button" type="submit">Save course</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade planit-modal" id="assessmentModal" tabindex="-1" aria-labelledby="assessmentModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="assessmentForm">
                <div class="modal-header">
                    <div>
                        <span class="tiny-label">GRADE CHECKPOINT</span>
                        <h2 id="assessmentModalTitle" class="modal-title">Add assessment</h2>
                    </div>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div id="assessmentFormError" class="form-error" hidden></div>

                    <label class="task-field">
                        <span>Name</span>
                        <input id="assessmentName" type="text" maxlength="120" required>
                    </label>

                    <div class="task-form-grid">
                        <label class="task-field">
                            <span>Weight (%)</span>
                            <input id="assessmentWeight" type="number" min="0.01" max="100" step="0.01" required>
                        </label>

                        <label class="task-field">
                            <span>Maximum score</span>
                            <input id="assessmentMaxScore" type="number" min="0.01" step="0.01" required>
                        </label>
                    </div>

                    <label class="task-field">
                        <span>Score (leave empty if not graded)</span>
                        <input id="assessmentScore" type="number" min="0" step="0.01">
                    </label>
                </div>

                <div class="modal-footer">
                    <button class="soft-button" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button id="assessmentSubmitButton" class="primary-button" type="submit">Save assessment</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade planit-modal" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="projectForm">
                <div class="modal-header">
                    <div>
                        <span class="tiny-label">PROJECT QUEST</span>
                        <h2 id="projectModalTitle" class="modal-title">Add project</h2>
                    </div>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div id="projectFormError" class="form-error" hidden></div>

                    <label class="task-field">
                        <span>Project title</span>
                        <input id="projectTitle" type="text" maxlength="200" required>
                    </label>

                    <div class="task-form-grid">
                        <label class="task-field">
                            <span>Subject</span>
                            <select id="projectSubject">
                                <option value="">No subject</option>
                            </select>
                        </label>

                        <label class="task-field">
                            <span>Due date</span>
                            <input id="projectDueDate" type="date">
                        </label>
                    </div>

                    <label class="task-field">
                        <span>Description</span>
                        <textarea id="projectDescription" rows="3" maxlength="2000"></textarea>
                    </label>
                </div>

                <div class="modal-footer">
                    <button class="soft-button" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button id="projectSubmitButton" class="primary-button" type="submit">Save project</button>
                </div>
            </form>
        </div>
    </div>
</div>
